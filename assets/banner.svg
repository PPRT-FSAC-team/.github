  <circle cx="990" cy="102" r="10" fill="#bdf367"/><circle cx="990" cy="102" r="23" fill="none" stroke="#bdf367" opacity=".45"/>
  <path d="M64 70 H112" stroke="#bdf367" stroke-width="5"/>
