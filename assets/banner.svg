    <linearGradient id="track"><stop stop-color="#36d6c5"/><stop offset="1" stop-color="#bdf367"/></linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M 44 0 H 0 V 44" fill="none" stroke="#7dd3cf" stroke-opacity=".07"/></pattern>
  </defs>
  <rect width="1440" height="440" rx="20" fill="url(#bg)"/>
  <rect width="1440" height="440" rx="20" fill="url(#grid)"/>
  <path d="M990 102 C1110 30 1305 65 1322 150 C1340 235 1153 220 1163 298 C1174 376 963 400 905 316 C843 226 1031 230 990 102Z" fill="none" stroke="#2b5965" stroke-width="58"/>
